name: Build and Deploy Hugo Portfolio

on:
  push:
    branches:
      - portfolio-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.140.0'

      - name: Build site
        run: hugo --source portfolio --destination public --verbose

      - name: Debug: List directories
        run: |
          echo "Current directory:"
          pwd
          echo "Root directory contents:"
          ls -la
          echo "Portfolio directory contents:"
          ls -la portfolio/ || echo "portfolio dir not found"

      - name: Verify build output
        run: |
          ls -la public
          echo "build output directory exists"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: public
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy portfolio site'
