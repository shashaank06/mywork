name: Build and Deploy Hugo Portfolio

on:
  push:
    branches:
      - portfolio-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.140.0'

      - name: Build site
        run: |
          hugo --source portfolio --destination "${{ github.workspace }}/public" 2>&1
          echo "Exit code: $?"

      - name: Debug output
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type d -name "public" 2>/dev/null || echo "No public dir found"

      - name: Verify build output
        run: |
          ls -la public
          echo "build output directory exists"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          publish_dir: public
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy portfolio site'
